<!DOCTYPE html>

<style>
.quiz-wrap{max-width:760px;margin:0 auto}
.quiz-card{background:#fff;border:1px solid rgba(20,24,40,.08);border-radius:16px;box-shadow:0 10px 30px rgba(20,24,40,.08);padding:28px 24px;margin-top:24px}
.quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.quiz-progress-track{flex:1;height:8px;background:rgba(20,24,40,.08);border-radius:99px;overflow:hidden}
.quiz-progress-bar{height:100%;background:var(--orange,#F28C28);width:0%;transition:width .3s ease}
.quiz-progress-text{font-size:.85rem;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.quiz-question{font-size:1.35rem;line-height:1.5;margin:0 0 18px}
.quiz-options{display:grid;gap:12px}
.quiz-option{display:block;width:100%;text-align:left;background:#fff;border:2px solid rgba(20,24,40,.12);border-radius:12px;padding:14px 16px;font-size:1rem;line-height:1.5;cursor:pointer;transition:border-color .15s ease,background .15s ease;font-family:inherit;color:inherit}
.quiz-option,.quiz-start-btn,.quiz-ghost-btn,.quiz-cta-btn{-webkit-tap-highlight-color:transparent}
.quiz-option:focus,.quiz-start-btn:focus,.quiz-ghost-btn:focus,.quiz-cta-btn:focus{outline:none}
.quiz-start-btn,.quiz-cta-btn{display:inline-block;background:var(--orange,#F28C28);color:#fff;font-weight:700;letter-spacing:.03em;border:none;border-radius:999px;padding:14px 28px;font-size:1rem;cursor:pointer;text-decoration:none;font-family:inherit}
.quiz-ghost-btn{display:inline-block;background:transparent;color:inherit;font-weight:700;border:2px solid rgba(20,24,40,.2);border-radius:999px;padding:12px 24px;font-size:.95rem;cursor:pointer;text-decoration:none;font-family:inherit}
.quiz-result-country{font-size:2.2rem;line-height:1.2;margin:6px 0 2px}
.quiz-result-capital{opacity:.65;margin:0 0 16px}
.quiz-points{margin:14px 0 0;padding-left:1.2em;line-height:1.8}
.quiz-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.quiz-hidden{display:none}
</style>
</head>
<body class="renewal-inner page-quiz">
<!-- HEADER -->
<header class="header">
<a class="logo" href="index.html#home">

</a>
</header>
<main>
<section class="section">
<div class="renewal-shell quiz-wrap">
<p class="section-label" data-en="QUIZ" data-ja="クイズ">QUIZ</p>
<h1 data-en="Which African Country Matches You?" data-ja="あなたに合うアフリカの国は？">Which African Country Matches You?</h1>
<p data-en="Answer 12 questions and find the African country that fits your style." data-ja="12の質問に答えると、あなたのスタイルに合うアフリカの国がわかります。">Answer 12 questions and find the African country that fits your style.</p>

<div class="quiz-card" id="quizStart">
<p data-en="It takes about 2 minutes. There are no right or wrong answers — just follow your instincts." data-ja="所要時間は約2分。正解はありません。直感で選んでみてください。">It takes about 2 minutes. There are no right or wrong answers — just follow your instincts.</p>
<div class="quiz-actions">

<div class="quiz-options" id="optionsBox"></div>

<button class="quiz-ghost-btn" id="retakeBtn" type="button"><span data-en="RETAKE" data-ja="もう一度やる">RETAKE</span></button>

</div>
</div>

</div>
</section>
</main>

var current=0, scores={}, lastPicked={};
var startBox=document.getElementById("quizStart"),
    mainBox=document.getElementById("quizMain"),
    resultBox=document.getElementById("quizResult"),
    qText=document.getElementById("questionText"),
    optBox=document.getElementById("optionsBox"),
    pText=document.getElementById("progressText"),
    pBar=document.getElementById("progressBar");
function renderQuestion(){
  var L=lang(), q=QUESTIONS[current];
  pText.textContent="Q"+(current+1)+" / "+QUESTIONS.length;
  pBar.style.width=Math.round(current/QUESTIONS.length*100)+"%";
  qText.textContent=q.q[L];
  optBox.innerHTML="";
  q.options.forEach(function(opt){
    var b=document.createElement("button");
    b.type="button"; b.className="quiz-option"; b.textContent=opt.t[L];
    b.addEventListener("click",function(){
      b.blur();
      scores[opt.c]=(scores[opt.c]||0)+1;
      lastPicked[opt.c]=current;
      current++;
      if(current<QUESTIONS.length){ renderQuestion(); } else { showResult(); }
    });
    optBox.appendChild(b);
  });
}
function showResult(){
  var L=lang(), best=null, bestScore=-1, bestLast=-1;
  Object.keys(scores).forEach(function(code){
    var s=scores[code], l=lastPicked[code];
    if(s>bestScore || (s===bestScore && l>bestLast)){ best=code; bestScore=s; bestLast=l; }
  });
  var r=RESULTS[best];
  document.getElementById("resultCountry").textContent=r.name[L];
  document.getElementById("resultCapital").textContent=r.capital[L];
  document.getElementById("resultWhy").textContent=r.why[L];
  var ul=document.getElementById("resultPoints"); ul.innerHTML="";
  r.points.forEach(function(p){ var li=document.createElement("li"); li.textContent=p[L]; ul.appendChild(li); });
  pBar.style.width="100%";
  mainBox.classList.add("quiz-hidden");
  resultBox.classList.remove("quiz-hidden");
  resultBox.scrollIntoView({behavior:"smooth",block:"start"});
}
document.getElementById("startBtn").addEventListener("click",function(){
  startBox.classList.add("quiz-hidden");
  resultBox.classList.add("quiz-hidden");
  mainBox.classList.remove("quiz-hidden");
  current=0; scores={}; lastPicked={};
  renderQuestion();
});
document.getElementById("retakeBtn").addEventListener("click",function(){
  resultBox.classList.add("quiz-hidden");
  mainBox.classList.remove("quiz-hidden");
  current=0; scores={}; lastPicked={};
  renderQuestion();
});
})();
</script>
